<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b28"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fondo y aura -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="220" fill="url(#aura)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="#ff003c" stroke-width="20"/>
  
  <!-- Letras SKZ -->
  <text x="256" y="335" font-family="system-ui, -apple-system, 'Space Grotesk', sans-serif" font-weight="900" font-size="180" fill="#ffffff" text-anchor="middle" letter-spacing="8">SKZ</text>
  
  <!-- Detalle neón cian -->
  <circle cx="410" cy="120" r="26" fill="#00f0ff"/>
</svg>
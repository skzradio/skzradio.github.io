<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SKZ RADIO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23181b28'/%3E%3Cstop offset='100%25' stop-color='%2308090d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23bg)' stroke='%23ff003c' stroke-width='4'/%3E%3Ctext x='32' y='42' font-family='system-ui, -apple-system, sans-serif' font-weight='900' font-size='23' fill='%23ffffff' text-anchor='middle' letter-spacing='1.5'%3ESKZ%3C/text%3E%3Ccircle cx='51' cy='15' r='3.5' fill='%2300f0ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #08090d;
      --surface-1: rgba(18, 20, 28, 0.92);
      --surface-2: rgba(28, 32, 45, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 0, 60, 0.45);
      --skz-crimson: #ff003c;
      --skz-glow: rgba(255, 0, 60, 0.45);
      --accent-cyan: #00f0ff;
      --text-primary: #ffffff;
      --text-secondary: #9499ad;
      --text-muted: #5a5f73;
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100%;
      height: var(--app-height);
      max-height: var(--app-height);
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    body {
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(255, 0, 60, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 85% 100%, rgba(0, 240, 255, 0.12) 0%, transparent 45%);
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      height: 48px;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(8, 9, 13, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex-shrink: 0;
      z-index: 50;
    }

    @media (min-width: 900px) {
      .header-bar {
        height: 54px;
        padding: 0 28px;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px var(--skz-glow));
      transition: transform 0.2s ease;
    }

    .brand-logo-icon:hover {
      transform: scale(1.05);
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
    }

    @media (min-width: 900px) {
      .brand-logo-icon { 
        width: 32px; 
        height: 32px; 
      }
      .brand-name { 
        font-size: 18px; 
      }
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--skz-crimson);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--skz-crimson);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--skz-crimson);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .workspace {
      flex: 1;
      width: 100%;
      height: calc(var(--app-height) - 48px);
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 900px) {
      .workspace {
        display: grid;
        grid-template-columns: minmax(360px, 460px) 1fr;
        gap: 20px;
        padding: 14px 28px 18px 28px;
        height: calc(100vh - 54px);
        max-width: 1920px;
        margin: 0 auto;
        box-sizing: border-box;
      }
    }

    @media (min-width: 1440px) {
      .workspace {
        grid-template-columns: 500px 1fr;
        gap: 28px;
        padding: 18px 36px 22px 36px;
      }
    }

    .player-deck {
      background: var(--surface-1);
      border-radius: 0;
      padding: 8px 14px 10px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    @media (min-width: 900px) {
      .player-deck {
        border: 1px solid var(--border-subtle);
        border-radius: 24px;
        padding: 16px 22px 14px 22px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      }
    }

    .deck-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 0;
      flex: 1;
      justify-content: center;
    }

    .cover-wrapper {
      width: 100%;
      max-width: min(84vw, 300px);
      aspect-ratio: 1 / 1;
      height: auto;
      max-height: min(300px, 34vh);
      border-radius: 20px;
      margin-bottom: 6px;
      position: relative;
      background: #0d0f17;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex-shrink: 1;
    }

    @media (min-width: 900px) {
      .cover-wrapper {
        max-width: min(440px, 40vh);
        max-height: min(420px, 40vh);
        border-radius: 24px;
        margin-bottom: 12px;
      }
    }

    .cover-img {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
      transform: scale(1);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .cover-wrapper::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), rgba(0, 240, 255, 0.18), transparent);
      transform: rotate(25deg);
      opacity: 0;
      pointer-events: none;
    }

    .is-playing .cover-wrapper {
      border-color: rgba(255, 0, 60, 0.45);
      animation: kpopAura 3.6s infinite alternate ease-in-out;
    }

    .is-playing .cover-img {
      animation: kpopPulse 3.6s infinite alternate ease-in-out;
    }

    .is-playing .cover-wrapper::after {
      opacity: 1;
      animation: kpopSweep 4.5s infinite ease-in-out;
    }

    @keyframes kpopPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.035); }
    }

    @keyframes kpopAura {
      0% {
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8), 0 0 18px rgba(255, 0, 60, 0.25);
      }
      100% {
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 32px rgba(255, 0, 60, 0.45), 0 0 18px rgba(0, 240, 255, 0.25);
      }
    }

    @keyframes kpopSweep {
      0% { transform: translateX(0) rotate(25deg); }
      25%, 100% { transform: translateX(550px) rotate(25deg); }
    }

    .meta-mode {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 2px;
    }

    .title-marquee-container {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      position: relative;
      text-align: center;
      margin-bottom: 2px;
      mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
    }

    .meta-title {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      display: inline-block;
      will-change: transform;
      padding: 0 6px;
    }

    @media (min-width: 900px) {
      .meta-title {
        font-size: 21px;
      }
    }

    .meta-title.animate-marquee {
      animation: pingPongMarquee 10s ease-in-out infinite alternate;
    }

    @keyframes pingPongMarquee {
      0%, 15% { transform: translateX(0); }
      85%, 100% { transform: translateX(var(--scroll-distance, -40px)); }
    }

    .meta-artist {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
    }

    .deck-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    @media (min-width: 900px) {
      .deck-bottom {
        gap: 10px;
      }
    }

    .equalizer-canvas-container {
      width: 100%;
      height: 36px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: -2px;
      overflow: hidden;
      contain: strict;
    }

    @media (min-width: 900px) {
      .equalizer-canvas-container {
        height: 48px;
      }
    }

    #equalizerCanvas {
      width: 100%;
      height: 100%;
      display: block;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .timeline {
      width: 100%;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--skz-crimson), #ff4d6d);
      border-radius: 8px;
      box-shadow: 0 0 10px var(--skz-crimson);
      pointer-events: none;
      position: relative;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px var(--skz-crimson);
      opacity: 0.9;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    /* FILA DE CONTROLES: 4 BOTONES EXACTOS SIN DESBORDAMIENTO */
    .playback-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 2px 0;
    }

    @media (min-width: 900px) {
      .playback-controls {
        gap: 16px;
      }
    }

    .btn-step {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-step:active {
      transform: scale(0.92);
    }

    .btn-play-hero {
      background: linear-gradient(135deg, var(--skz-crimson), #e60036);
      border: none;
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--skz-glow);
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
    }

    .btn-play-hero:active {
      transform: scale(0.94);
    }

    /* BOTÓN CANCIONES FLUIDO */
    .btn-open-catalog {
      background: rgba(255, 0, 60, 0.16);
      border: 1px solid rgba(255, 0, 60, 0.45);
      color: #ffffff;
      padding: 0 14px;
      height: 42px;
      border-radius: 21px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(255, 0, 60, 0.2);
      flex-shrink: 0;
    }

    .btn-open-catalog:active {
      transform: scale(0.94);
      background: var(--skz-crimson);
    }

    @media (min-width: 900px) {
      .btn-open-catalog {
        display: none !important;
      }
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 34px;
    }

    .vol-icon {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: fill 0.2s;
    }

    .vol-icon:hover {
      fill: var(--text-primary);
    }

    .volume-slider {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(to right, var(--skz-crimson) 100%, rgba(255, 255, 255, 0.1) 100%);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px var(--skz-crimson);
    }

    .library-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      height: var(--app-height);
      background: rgba(10, 12, 17, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 100;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)) 16px;
      display: flex;
      flex-direction: column;
      box-shadow: none;
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.2, 1);
      visibility: hidden;
    }

    .library-panel.drawer-open {
      transform: translateY(0%);
      visibility: visible;
    }

    @media (min-width: 900px) {
      .library-panel {
        position: static;
        width: 100%;
        height: 100%;
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: 24px;
        padding: 20px 24px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        transform: none !important;
        visibility: visible !important;
        z-index: 1;
        overflow: hidden;
      }
    }

    .drawer-mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    @media (min-width: 900px) {
      .drawer-mobile-header {
        display: none;
      }
    }

    .drawer-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-close-drawer {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-close-drawer:active {
      background: var(--skz-crimson);
    }

    .panel-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .panel-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
    }

    .tabs-group {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .tabs-group {
        width: auto;
      }
    }

    .tab-item {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 8px 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .tab-pill {
      background: var(--skz-crimson);
      color: white;
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    @media (min-width: 640px) {
      .search-wrapper {
        max-width: 280px;
      }
    }

    .search-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 34px 8px 12px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      min-height: 38px;
    }

    .search-field:focus {
      border-color: var(--border-focus);
    }

    .btn-clear-search {
      position: absolute;
      right: 8px;
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
    }

    .btn-clear-search:hover {
      background: var(--skz-crimson);
      color: #ffffff;
    }

    .list-viewport {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
      padding-right: 4px;
    }

    .list-viewport::-webkit-scrollbar {
      width: 4px;
    }
    .list-viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .tracks-grid {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
    }

    .track-row:active {
      background: rgba(255, 255, 255, 0.06);
    }

    .row-main {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      min-width: 0;
    }

    .row-index {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 20px;
      flex-shrink: 0;
    }

    .row-details {
      overflow: hidden;
      min-width: 0;
    }

    .row-name {
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-add-queue {
      background: rgba(255, 0, 60, 0.14);
      border: 1px solid rgba(255, 0, 60, 0.35);
      color: #ff3366;
      font-family: inherit;
      font-weight: 700;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .btn-add-queue:active {
      background: var(--skz-crimson);
      color: #fff;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="brand">
      <svg class="brand-logo-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="headerLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#181b28"/>
            <stop offset="100%" stop-color="#08090d"/>

    function buildPrecomputedLookup() {
      const minIndex = 1;
      const binCount = analyser ? analyser.frequencyBinCount : 128;
      const maxIndex = Math.max(2, Math.floor(binCount * 0.65));

      for (let i = 0; i < NUM_BARS; i++) {
        const fraction = i / (NUM_BARS - 1);
        precomputedBins[i] = Math.min(
          maxIndex,
          Math.floor(minIndex * Math.pow(maxIndex / minIndex, fraction))
        );
        precomputedBoosts[i] = 1 + Math.pow(fraction, 1.7) * 0.92;
      }
    }

    function resizeCanvas() {
      if (!canvas || !canvas.parentElement || !ctx) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      eqLogicalWidth = rect.width;
      eqLogicalHeight = rect.height;

      // Escalar al pixel ratio de la pantalla (limitado a 2x para evitar sobrecarga en gama baja)
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(eqLogicalWidth * dpr);
      canvas.height = Math.round(eqLogicalHeight * dpr);

      // Normalizar contexto a coordenadas CSS para nitidez absoluta sin bordes borrosos
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      // Reutilizar un único degradado vertical precalculado (no crear miles por segundo)
      cachedBarGradient = ctx.createLinearGradient(0, eqLogicalHeight, 0, 0);
      cachedBarGradient.addColorStop(0, "#ff003c");
      cachedBarGradient.addColorStop(0.55, "#ff2a6d");
      cachedBarGradient.addColorStop(1, "#00f0ff");

      buildPrecomputedLookup();

      if (!isPlaying) {
        renderIdleBars();
      }
    }

    function initAudioContext() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.minDecibels = -80;
          analyser.maxDecibels = -10;
          analyser.smoothingTimeConstant = 0.58;

          try {
            const source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
          } catch (e) {
            console.warn("Audio node routing notice:", e);
          }
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          buildPrecomputedLookup();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (err) {
        console.warn("AudioContext init handled:", err);
      }
    }

    function renderIdleBars() {
      if (!ctx || eqLogicalWidth <= 0 || eqLogicalHeight <= 0) return;
      ctx.clearRect(0, 0, eqLogicalWidth, eqLogicalHeight);
      const barSpacing = Math.max(2, Math.floor(eqLogicalWidth / 130));
      const barWidth = Math.max(2, Math.floor((eqLogicalWidth - (NUM_BARS - 1) * barSpacing) / NUM_BARS));
      const baselineY = eqLogicalHeight - 3;

      ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
      for (let i = 0; i < NUM_BARS; i++) {
        const x = i * (barWidth + barSpacing);
        ctx.fillRect(x, baselineY, barWidth, 3);
        peaks[i] = 0;
      }
    }

    function drawEqualizer() {
      if (!isPlaying || !analyser || !ctx || eqLogicalWidth <= 0) {
        renderIdleBars();
        return;
      }

      eqAnimId = requestAnimationFrame(drawEqualizer);
      ctx.clearRect(0, 0, eqLogicalWidth, eqLogicalHeight);

      analyser.getByteFrequencyData(dataArray);

      const barSpacing = Math.max(2, Math.floor(eqLogicalWidth / 130));
      const barWidth = Math.max(2, Math.floor((eqLogicalWidth - (NUM_BARS - 1) * barSpacing) / NUM_BARS));
      const H = eqLogicalHeight;

      // 1. Dibujar todas las barras con el degradado en un solo pase de estilo
      ctx.fillStyle = cachedBarGradient || "#ff003c";
      for (let i = 0; i < NUM_BARS; i++) {
        const val = dataArray[precomputedBins[i]] || 0;
        const norm = Math.min(1, (val / 255) * precomputedBoosts[i]);
        let barHeight = Math.pow(norm, 1.22) * H * 1.3;
        if (barHeight < 3) barHeight = 3;
        else if (barHeight > H) barHeight = H;

        const x = i * (barWidth + barSpacing);
        const y = H - barHeight;

        ctx.fillRect(x, y, barWidth, barHeight);

        if (barHeight >= peaks[i]) {
          peaks[i] = barHeight;
        } else {
          peaks[i] = Math.max(0, peaks[i] - 1.9);
        }
      }

      // 2. Dibujar los topes de pico en un solo pase secundario
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < NUM_BARS; i++) {
        if (peaks[i] > 5) {
          const x = i * (barWidth + barSpacing);
          const peakY = H - peaks[i];
          ctx.fillRect(x, peakY - 3, barWidth, 2);
        }
      }
    }

    function startEqualizer() {
      if (!eqAnimId) {
        eqAnimId = requestAnimationFrame(drawEqualizer);
      }
    }

    function stopEqualizer() {
      if (eqAnimId) {
        cancelAnimationFrame(eqAnimId);
        eqAnimId = null;
      }
      renderIdleBars();
    }

    function updateTitleMarquee(title) {
      trackTitle.textContent = title;
      trackTitle.classList.remove("animate-marquee");
      trackTitle.style.transform = "translateX(0)";

      requestAnimationFrame(() => {
        const containerW = marqueeBox.clientWidth;
        const textW = trackTitle.scrollWidth;

        if (textW > containerW - 6) {
          const distance = -(textW - containerW + 20);
          trackTitle.style.setProperty("--scroll-distance", `${distance}px`);
          trackTitle.classList.add("animate-marquee");
        }
      });
    }

    async function loadCatalog() {
      const isBlobOrAbout = window.location.protocol === 'blob:' || window.location.protocol === 'about:';
      let loaded = false;

      if (!isBlobOrAbout) {
        try {
          const res = await fetch('canciones.json');
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              TRACKS = data;
              loaded = true;
            }
          }
        } catch (_) {}
      }

      if (!loaded && isBlobOrAbout) {
        try {
          const res = await fetch('https://castleradio.github.io/repro/canciones.json');
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              TRACKS = data;
              loaded = true;
            }
          }
        } catch (_) {}
      }

      if (!loaded) {
        TRACKS = [...FALLBACK_TRACKS];
      }

      TRACKS = enrichTracksWithAlbums(TRACKS);
      renderCatalog();
    }
    loadCatalog();

    function getRandomTrack() {
      if (TRACKS.length === 0) return null;
      let next;
      do {
        next = TRACKS[Math.floor(Math.random() * TRACKS.length)];
      } while (TRACKS.length > 1 && currentTrack && next.id === currentTrack.id);
      return next;
    }

    function fetchOfficialCover(songTitle) {
      const cleanTitle = songTitle.replace(/[#_\(\)]/g, ' ').replace(/\s+/g, ' ').trim();
      
      if (coverCache[cleanTitle]) {
        coverImg.src = coverCache[cleanTitle];
        if (albumCache[cleanTitle] && currentTrack) {
          trackArtist.textContent = `${albumCache[cleanTitle]} • ${currentTrack.artist || 'Stray Kids'}`;
        }
        return;
      }

      const query = encodeURIComponent(`Stray Kids ${cleanTitle}`);
      fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=1`)
        .then(res => res.json())
        .then(data => {
          if (data.results && data.results.length > 0) {
            const item = data.results[0];
            const hiresCover = item.artworkUrl100.replace('100x100bb', '600x600bb');
            coverCache[cleanTitle] = hiresCover;
            coverImg.src = hiresCover;

            // Extraer y mostrar el nombre oficial del álbum (ej: ATE, 5-STAR, ROCK-STAR, NOEASY)
            if (item.collectionName) {
              albumCache[cleanTitle] = item.collectionName;
              if (currentTrack && currentTrack.title === songTitle) {
                trackArtist.textContent = `${item.collectionName} • ${currentTrack.artist || 'Stray Kids'}`;
              }
            }
          } else {
            coverImg.src = DEFAULT_SVG_COVER;
          }
        })
        .catch(() => {
          coverImg.src = DEFAULT_SVG_COVER;
        });
    }

    function playTrack(track, isFromQueue = false) {
      initAudioContext();

      if (currentTrack) history.push(currentTrack);
      currentTrack = track;

      let fileName = track.file.replace(/^audio[\\\/]/, '');
      let audioBase = 'audio/';
      
      if (window.location.protocol === 'blob:' || window.location.protocol === 'about:') {
        audioBase = 'https://castleradio.github.io/repro/audio/';
      }

      audio.src = audioBase + encodeURIComponent(fileName);

      updateTitleMarquee(track.title);

      // Si ya tenemos el álbum oficial en caché lo usamos; si no, muestra el inicial mientras consulta
      const cleanTitle = track.title.replace(/[#_\(\)]/g, ' ').replace(/\s+/g, ' ').trim();
      const currentAlbum = albumCache[cleanTitle] || track.album || 'Stray Kids';
      trackArtist.textContent = `${currentAlbum} • ${track.artist || 'Stray Kids'}`;

      if (isFromQueue) {
        modeIndicator.textContent = "⚡ PETICIÓN PRIORITARIA";
        modeIndicator.style.color = "var(--skz-crimson)";
      } else {
        modeIndicator.textContent = "AUTO-RADIO ALEATORIO";
        modeIndicator.style.color = "var(--accent-cyan)";
      }

      fetchOfficialCover(track.title);

      audio.play().then(() => {
        setPlaying(true);
      }).catch(err => {
        console.warn("Reproducción en espera:", err);
      });

      renderQueue();
    }

    function playNext() {
      if (queue.length > 0) {
        const nextInLine = queue.shift();
        playTrack(nextInLine, true);
      } else {
        const nextSong = getRandomTrack();
        if (nextSong) playTrack(nextSong, false);
      }
    }

    window.requestSong = function(id) {
      const song = TRACKS.find(t => t.id === id);
      if (!song) return;

      if (!currentTrack || audio.paused) {
        playTrack(song, true);
        closeSongsDrawer();
      } else {
        queue.push(song);
        renderQueue();
      }
    };

    function setPlaying(playing) {
      isPlaying = playing;
      if (playing) {
        playerDeck.classList.add("is-playing");
        playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
        startEqualizer();
      } else {
        playerDeck.classList.remove("is-playing");
        playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        stopEqualizer();
      }
    }

    btnPlay.addEventListener("click", () => {
      initAudioContext();
      if (!currentTrack) {
        playNext();
      } else if (audio.paused) {
        audio.play();
        setPlaying(true);
      } else {
        audio.pause();
        setPlaying(false);
      }
    });

    btnNext.addEventListener("click", () => {
      initAudioContext();
      playNext();
    });

    btnPrev.addEventListener("click", () => {
      initAudioContext();
      if (history.length > 0) {
        const prev = history.pop();
        playTrack(prev, false);
      }
    });

    audio.addEventListener("ended", playNext);

    function openSongsDrawer() {
      libraryPanel.classList.add("drawer-open");
    }

    function closeSongsDrawer() {
      libraryPanel.classList.remove("drawer-open");
    }

    btnOpenSongs.addEventListener("click", openSongsDrawer);
    btnCloseDrawer.addEventListener("click", closeSongsDrawer);

    function updateProgressUI(currentTime, duration) {
      if (!isNaN(duration) && duration > 0) {
        const pct = (currentTime / duration) * 100;
        progressFill.style.width = `${pct}%`;
        labelCurrent.textContent = formatTime(currentTime);
        labelTotal.textContent = formatTime(duration);
      }
    }

    audio.addEventListener("timeupdate", () => {
      if (!isDragging) {
        updateProgressUI(audio.currentTime, audio.duration);
      }
    });

    function seekFromEvent(e) {
      const rect = progressTrack.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (!isNaN(audio.duration)) {
        const targetTime = pos * audio.duration;
        updateProgressUI(targetTime, audio.duration);
        return targetTime;
      }
      return 0;
    }

    progressTrack.addEventListener("pointerdown", (e) => {
      isDragging = true;
      progressTrack.classList.add("is-dragging");
      progressTrack.setPointerCapture(e.pointerId);
      const targetTime = seekFromEvent(e);
      audio.currentTime = targetTime;
    });

    progressTrack.addEventListener("pointermove", (e) => {
      if (isDragging) {
        const targetTime = seekFromEvent(e);
        audio.currentTime = targetTime;
      }
    });

    function stopDragging(e) {
      if (isDragging) {
        isDragging = false;
        progressTrack.classList.remove("is-dragging");
        try {
          progressTrack.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
    }

    progressTrack.addEventListener("pointerup", stopDragging);
    progressTrack.addEventListener("pointercancel", stopDragging);

    function updateVolumeVisual(val) {
      audio.volume = val;
      const pct = Math.round(val * 100);
      volumeControl.style.background = `linear-gradient(to right, var(--skz-crimson) ${pct}%, rgba(255, 255, 255, 0.1) ${pct}%)`;
    }

    updateVolumeVisual(1);

    volumeControl.addEventListener("input", (e) => {
      updateVolumeVisual(parseFloat(e.target.value));
    });

    volMuteBtn.addEventListener("click", () => {
      volumeControl.value = 0;
      updateVolumeVisual(0);
    });

    volMaxBtn.addEventListener("click", () => {
      volumeControl.value = 1;
      updateVolumeVisual(1);
    });

    function formatTime(s) {
      const mins = Math.floor(s / 60) || 0;
      const secs = Math.floor(s % 60) || 0;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    tabCatalog.addEventListener("click", () => {
      tabCatalog.classList.add("active");
      tabQueue.classList.remove("active");
      catalogView.style.display = "flex";
      queueView.style.display = "none";
      searchField.parentElement.style.display = "flex";
    });

    tabQueue.addEventListener("click", () => {
      tabQueue.classList.add("active");
      tabCatalog.classList.remove("active");
      queueView.style.display = "flex";
      catalogView.style.display = "none";
      searchField.parentElement.style.display = "none";
    });

    function renderCatalog(filter = "") {
      catalogView.innerHTML = "";
      const q = filter.toLowerCase().trim();
      const filtered = TRACKS.filter(t => t.title.toLowerCase().includes(q) || (t.album && t.album.toLowerCase().includes(q)));

      filtered.forEach((t, idx) => {
        const li = document.createElement("li");
        li.className = "track-row";
        li.innerHTML = `
          <div class="row-main">
            <span class="row-index">${(idx + 1).toString().padStart(2, '0')}</span>
            <div class="row-details">
              <div class="row-name">${t.title}</div>
              <div class="row-sub">${t.album || 'Stray Kids'} • ${t.artist || 'Stray Kids'}</div>
            </div>
          </div>
          <button class="btn-add-queue" onclick="requestSong(${t.id})">+ PEDIR</button>
        `;
        catalogView.appendChild(li);
      });
    }

    function renderQueue() {
      queueBadge.textContent = queue.length;
      queueView.innerHTML = "";

      if (queue.length === 0) {
        queueView.innerHTML = `
          <li style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;">
            No hay canciones en cola.<br>Sonando en modo Auto-Radio aleatorio.
          </li>
        `;
        return;
      }

      queue.forEach((t, idx) => {
        const li = document.createElement("li");
        li.className = "track-row";
        li.innerHTML = `
          <div class="row-main">
            <span class="row-index" style="color: var(--skz-crimson)">#${idx + 1}</span>
            <div class="row-details">
              <div class="row-name">${t.title}</div>
              <div class="row-sub">${t.album || 'Stray Kids'}</div>
            </div>
          </div>
          <span style="font-size: 11px; font-weight: 700; color: var(--skz-crimson); padding-right: 6px;">EN TURNO</span>
        `;
        queueView.appendChild(li);
      });
    }

    searchField.addEventListener("input", (e) => {
      const val = e.target.value;
      btnClearSearch.style.display = val.length > 0 ? "flex" : "none";
      renderCatalog(val);
    });

    btnClearSearch.addEventListener("click", () => {
      searchField.value = "";
      btnClearSearch.style.display = "none";
      searchField.focus();
      renderCatalog("");
    });
  </script>
</body>
